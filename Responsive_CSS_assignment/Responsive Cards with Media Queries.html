<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Cards with Media Queries</title>
  <link rel="stylesheet" href="Responsive Cards with Media Queries.css">
</head>
<body>
  <h1 class="title">Responsive Card Layout</h1>

  <div class="card-container">
    <div class="card">
      <h2>Card One</h2>
      <p>This is a responsive card using Flexbox and media queries.</p>
    </div>
    <div class="card">
      <h2>Card Two</h2>
      <p>Adapts to screen size — four, two, or one column layout.</p>
    </div>
    <div class="card">
      <h2>Card Three</h2>
      <p>Each card has smooth hover background transition.</p>
    </div>
    <div class="card">
      <h2>Card Four</h2>
      <p>Easy and elegant design using Flexbox responsiveness.</p>
    </div>
  </div>
</body>
</html>
