<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Responsive Image Filter Gallery</h1>
  
  <div class="gallery">
    <figure>
      <img src="https://picsum.photos/id/1015/400/300" alt="Mountain">
      <figcaption>Blur Effect</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1025/400/300" alt="Dog">
      <figcaption>Grayscale Effect</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1035/400/300" alt="Beach">
      <figcaption>Sepia Effect</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1045/400/300" alt="Forest">
      <figcaption>Brightness Effect</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1055/400/300" alt="City">
      <figcaption>Contrast Effect</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1065/400/300" alt="Desert">
      <figcaption>Hue Rotate Effect</figcaption>
    </figure>
  </div>
</body>
</html>
