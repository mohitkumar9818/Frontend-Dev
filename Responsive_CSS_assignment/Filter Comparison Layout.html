<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Before & After Image Filter Comparison</h1>
  </header>

  <main class="comparison-container">
    <!-- Before Image -->
    <div class="image-box">
      <img src="https://picsum.photos/id/1015/600/400" alt="Original Image">
      <p class="caption">Before (Original)</p>
    </div>

    <!-- After Image -->
    <div class="image-box filtered">
      <img src="https://picsum.photos/id/1015/600/400" alt="Filtered Image">
      <p class="caption">After (Brightness Filter)</p>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 Filter Comparison Demo</p>
  </footer>
</body>
</html>
