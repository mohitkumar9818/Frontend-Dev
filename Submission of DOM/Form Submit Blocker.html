<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Submit Blocker</title>
  <style>
    body { font-family: Arial; background:#eef3ff; padding:40px; }
    .form-box { max-width:450px; margin:auto; background:#fff; padding:25px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    .form-group { margin-bottom:18px; }
    label { font-weight:600; }
    input { width:100%; padding:10px; border:1px solid #aaa; border-radius:6px; }
    .error { color:#d20000; font-size:14px; margin-top:5px; display:none; }
    #success { display:none; margin-top:20px; font-weight:bold; color:green; }
    button { padding:10px 18px; border:none; background:#3d6bff; color:#fff; border-radius:6px; cursor:pointer; }
  </style>
</head>
<body>

<div class="form-box">
  <h2>Registration Form</h2>

  <form id="myForm">
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="name" />
      <div class="error" id="nameErr">Name is required</div>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="text" id="email" />
      <div class="error" id="emailErr">Enter a valid email</div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" />
      <div class="error" id="passErr">Password must be at least 6 characters</div>
    </div>

    <button type="submit">Submit</button>
  </form>

  <div id="success">Form Submitted Successfully!</div>
</div>

<script>
const form = document.getElementById('myForm');
const nameField = document.getElementById('name');
const emailField = document.getElementById('email');
const passField = document.getElementById('password');

const nameErr = document.getElementById('nameErr');
const emailErr = document.getElementById('emailErr');
const passErr = document.getElementById('passErr');
const successMsg = document.getElementById('success');

function validateFields() {
  let valid = true;

  if(nameField.value.trim() === ''){
    nameErr.style.display = 'block';
    valid = false;
  } else {
    nameErr.style.display = 'none';
  }

  if(!emailField.value.includes('@') || emailField.value.trim() === ''){
    emailErr.style.display = 'block';
    valid = false;
  } else {
    emailErr.style.display = 'none';
  }

  if(passField.value.length < 6){
    passErr.style.display = 'block';
    valid = false;
  } else {
    passErr.style.display = 'none';
  }

  return valid;
}

[nameField, emailField, passField].forEach(input => {
  input.addEventListener('input', validateFields);
});

form.addEventListener('submit', function(e){
  e.preventDefault(); 

  if(validateFields()){
    successMsg.style.display = 'block';
  } else {
    successMsg.style.display = 'none';
  }
});
</script>

</body>
</html>

<form id="myForm" class="form-container">
  <label>Name:
    <input type="text" id="name">
    <small class="error" id="nameError"></small>
  </label>

  <label>Email:
    <input type="text" id="email">
    <small class="error" id="emailError"></small>
  </label>

  <label>Password:
    <input type="password" id="password">
    <small class="error" id="passError"></small>
  </label>

  <button type="submit">Submit</button>
</form>

<p id="successMsg" class="success"></p>

<style>
  .error { color: red; font-size: 12px; }
  .success { color: green; font-weight: bold; }
  .form-container { display: flex; flex-direction: column; gap: 10px; width: 250px; }
</style>

<script>
const form = document.getElementById('myForm');
const successMsg = document.getElementById('successMsg');

const fields = {
  name: {
    input: document.getElementById('name'),
    error: document.getElementById('nameError'),
    validate: value => value.trim() !== ''
  },
  email: {
    input: document.getElementById('email'),
    error: document.getElementById('emailError'),
    validate: value => value.includes('@') && value.trim() !== ''
  },
  password: {
    input: document.getElementById('password'),
    error: document.getElementById('passError'),
    validate: value => value.length >= 6
  }
};

Object.values(fields).forEach(field => {
  field.input.addEventListener('input', () => {
    if (field.validate(field.input.value)) {
      field.error.textContent = '';
    }
  });
});

form.addEventListener('submit', function(e) {
  e.preventDefault(); 
  let valid = true;
  successMsg.textContent = '';

  Object.values(fields).forEach(field => {
    if (!field.validate(field.input.value)) {
      field.error.textContent = 'Invalid input!';
      valid = false;
    }
  });

  if (valid) {
    successMsg.textContent = 'Form Submitted Successfully!';
    form.reset();
  }
});
</script>
