<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Selection Page</title>
</head>
<body>
  <h1>Choose Your Travel Preferences</h1>
  
  <form>
    <label for="country">Country:</label>
    <select id="country" name="country">
      <option selected>India</option>
      <option>France</option>
      <option>Japan</option>
      <option>South Africa</option>
    </select>
    <br><br>

    <label for="state">State:</label>
    <select id="state" name="state">
      <option selected>Maharashtra</option>
      <option>Delhi</option>
      <option>Karnataka</option>
      <option>Tamil Nadu</option>
    </select>
    <br><br>

    <label for="city">City:</label>
    <select id="city" name="city">
      <option selected>Mumbai</option>
      <option>Pune</option>
      <option>Bangalore</option>
      <option>Chennai</option>
    </select>
    <br><br>

    <label for="tourist">Favorite Tourist Place:</label>
    <select id="tourist" name="tourist">
      <option selected>Gateway of India</option>
      <option>Marine Drive</option>
      <option>Chhatrapati Shivaji Terminus</option>
      <option>Elephanta Caves</option>
    </select>
    <br><br>
  </form>
  
  <p>
    Your current travel selections are: Country - India, State - Maharashtra, City - Mumbai, Favorite Tourist Place - Gateway of India.
  </p>
</body>
</html>
