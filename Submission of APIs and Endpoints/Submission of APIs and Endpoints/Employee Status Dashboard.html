<!DOCTYPE html>
<html>
<head>
  <title>Employee Status Dashboard</title>
  <style>
    table { width: 60%; border-collapse: collapse; margin-top: 20px; }
    td, th { padding: 10px; border: 1px solid #ccc; }
    .active { color: green; font-weight: bold; }
    .inactive { color: red; font-weight: bold; }
    .toggle-btn { padding: 5px 10px; cursor: pointer; }
    #error { color: red; margin-top: 20px; display: none; }
  </style>
</head>
<body>

<h2>Employee Status Dashboard</h2>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Status</th>
      <th>Toggle</th>
    </tr>
  </thead>
  <tbody id="employeeTable"></tbody>
</table>

<div id="error">Failed to update status. Try again.</div>

<script src="Employee Status Dashboard.js"></script>
</body>
</html>
