<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="Q6.css" />
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
  </header>
  <main>
    <section class="transform-container">
      <div class="box rotate">
        <div class="shape"></div>
        <p>rotate()</p>
      </div>
      <div class="box scale">
        <div class="shape"></div>
        <p>scale()</p>
      </div>
      <div class="box translate">
        <div class="shape"></div>
        <p>translate()</p>
      </div>
      <div class="box skew">
        <div class="shape"></div>
        <p>skew()</p>
      </div>
    </section>
  </main>
  <footer>
    <p>Demonstrating CSS Transformations with smooth transitions</p>
  </footer>
</body>
</html>
