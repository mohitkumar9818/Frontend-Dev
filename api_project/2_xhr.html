<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2. XHR Method</title>
</head>
<body>
    <h2>Check Console (F12) for XMLHttpRequest Output</h2>
    <script>
        const BASE_URL = "http://localhost:3000/students";

        function ajaxRequest(method, url, data = null) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open(method, url);
                xhr.setRequestHeader("Content-Type", "application/json");
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        resolve(xhr.responseText ? JSON.parse(xhr.responseText) : {});
                    } else {
                        reject("Error: " + xhr.status);
                    }
                };
                xhr.onerror = () => reject("Network error");
                xhr.send(data ? JSON.stringify(data) : null);
            });
        }

        async function runAllRequestsAjax() {
            console.log("--- Starting XHR Operations ---");
            
            // GET All
            await ajaxRequest("GET", BASE_URL).then(d => console.log("GET All:", d));
            
            // GET One
            await ajaxRequest("GET", `${BASE_URL}/1`).then(d => console.log("GET One:", d));
            
            // POST
            await ajaxRequest("POST", BASE_URL, { name: "Aman XHR", score: 88 }).then(d => console.log("POST Added:", d));
            
            // PUT
            await ajaxRequest("PUT", `${BASE_URL}/1`, { name: "Ram XHR Update", score: 99 }).then(d => console.log("PUT Updated:", d));
            
            // PATCH
            await ajaxRequest("PATCH", `${BASE_URL}/2`, { score: 45 }).then(d => console.log("PATCH Updated:", d));
            
            // DELETE (Note: ID 3 might be deleted by previous file, so checking errors)
            try {
                await ajaxRequest("DELETE", `${BASE_URL}/3`).then(() => console.log("DELETE Done"));
            } catch(e) { console.log("Item might already be deleted"); }
            
            console.log("--- Finished ---");
        }
        runAllRequestsAjax();
    </script>
</body>
</html>
