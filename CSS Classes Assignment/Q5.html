<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="Q5.css" />
</head>
<body>
  <header>
    <h1>Styled Button Collection</h1>
  </header>

  <main>
    <section class="button-container">
      <button class="btn primary">Primary Button</button>
      <button class="btn secondary">Secondary Button</button>
      <button class="btn outline">Outline Button</button>
      <button class="btn primary" disabled>Disabled Button</button>
    </section>
  </main>

  <footer>
    <p>Demonstrating button styles with pseudo-classes</p>
  </footer>
</body>
</html>
