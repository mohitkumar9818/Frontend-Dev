<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="Q3.css" />
</head>
<body>
  <header>
    <h1>Modern Image Showcase</h1>
  </header>

  <main>
    <section class="gallery">
      <figure class="card">
        <div class="img-wrapper">
          <img src="https://picsum.photos/id/1015/400/250" alt="Mountain" />
          <div class="overlay"></div>
        </div>
        <figcaption>Peaceful Mountains</figcaption>
      </figure>

      <figure class="card">
        <div class="img-wrapper">
          <img src="https://picsum.photos/id/1025/400/250" alt="Dog" />
          <div class="overlay"></div>
        </div>
        <figcaption>Happy Puppy</figcaption>
      </figure>

      <figure class="card">
        <div class="img-wrapper">
          <img src="https://picsum.photos/id/1043/400/250" alt="Beach" />
          <div class="overlay"></div>
        </div>
        <figcaption>Sunny Beach</figcaption>
      </figure>

      <figure class="card">
        <div class="img-wrapper">
          <img src="https://picsum.photos/id/1062/400/250" alt="Forest" />
          <div class="overlay"></div>
        </div>
        <figcaption>Misty Forest</figcaption>
      </figure>

      <figure class="card">
        <div class="img-wrapper">
          <img src="https://picsum.photos/id/1039/400/250" alt="City" />
          <div class="overlay"></div>
        </div>
        <figcaption>Night City Lights</figcaption>
      </figure>

      <figure class="card">
        <div class="img-wrapper">
          <img src="https://picsum.photos/id/1074/400/250" alt="Desert" />
          <div class="overlay"></div>
        </div>
        <figcaption>Golden Desert</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>Responsive Image Showcase with Hover Effects</p>
  </footer>
</body>
</html>
