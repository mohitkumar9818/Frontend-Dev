<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Combined Effects Demonstration</title>
  <link rel="stylesheet" href="Q9.css" />
</head>
<body>
  <header>
    <h1>Combined CSS Effects</h1>
    <p>Hover over the buttons below to see transformations, transitions, and pseudo-classes in action.</p>
  </header>

  <main>
    <section class="button-container">
      <button class="btn btn-primary">Hover Me</button>
      <button class="btn btn-secondary">Focus Me</button>
      <button class="btn btn-accent">Active State</button>
      <button class="btn btn-outline">Combined Effects</button>
    </section>
  </main>

  <footer>
    <p>Demonstrating hover, focus, and active effects with smooth transitions.</p>
  </footer>
</body>
</html>
