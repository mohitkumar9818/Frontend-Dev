<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS Tooltip Demonstration</title>
  <link rel="stylesheet" href="Q2.css" />
</head>
<body>
  <header>
    <h1>CSS Tooltip Demonstration</h1>
  </header>

  <main>
    <div class="tooltip-container">
      <div class="tooltip-item">
        <span class="tooltip-icon">💡</span>
        <span class="tooltip-text">This is a light bulb tooltip!</span>
      </div>
      <div class="tooltip-item">
        <span class="tooltip-icon">📚</span>
        <span class="tooltip-text">Learn something new every day.</span>
      </div>
      <div class="tooltip-item">
        <span class="tooltip-icon">❤️</span>
        <span class="tooltip-text">Show some love!</span>
      </div>
      <div class="tooltip-item">
        <span class="tooltip-icon">⚙️</span>
        <span class="tooltip-text">Settings and preferences.</span>
      </div>
    </div>
  </main>

  <footer>
    <p>Tooltips built using only CSS transitions and positioning</p>
  </footer>
</body>
</html>
