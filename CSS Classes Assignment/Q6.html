<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS Animation Demonstration</title>
  <link rel="stylesheet" href="Q6.css" />
</head>
<body>
  <header>
    <h1>CSS Animation Demonstration</h1>
  </header>

  <main>
    <section class="animation-area">
      <div class="box move-box">Moving Box</div>
      <div class="ball bounce-ball"></div>
      <h2 class="text color-text">Color Changing Text</h2>
    </section>
  </main>

  <footer>
    <p>Animations created using @keyframes and smooth transitions</p>
  </footer>
</body>
</html>
