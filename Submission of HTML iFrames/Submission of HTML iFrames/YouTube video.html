<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Responsive YouTube (percentage width/height only)</title>
</head>
<body>

  <div style="max-width:100%; margin:0 auto; position:relative; padding-top:56.25%; /* 16:9 aspect ratio */">
    <iframe
      src="https://www.youtube.com/"
      title="YouTube video "
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
      style="position:absolute; top:0; left:0; width:100%; height:100%;"
    ></iframe>
  </div>
</body>
</html>
