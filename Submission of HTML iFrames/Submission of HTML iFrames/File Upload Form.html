<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Upload Form</title>
</head>
<body>
  <h2>Upload Your Image</h2>
  <p>Only image files in <strong>.jpg</strong> or <strong>.png</strong> format are allowed.</p>

  <form action="#" method="post" enctype="multipart/form-data">
    <label for="file">Choose an image to upload:</label><br><br>
    <input type="file" id="file" name="file" accept=".jpg, .png" required><br><br>
    <input type="submit" value="Upload">
  </form>

</body>
</html>
