<!DOCTYPE html>
<html>
<head>
  <title>Frameset Example</title>
</head>
<!-- Divide the page into two horizontal frames -->
<frameset rows="25%,75%">
  <!-- Top frame: Navigation links -->
  <frame src="top.html" name="topFrame" title="Navigation">

  <!-- Bottom frame: Welcome message -->
  <frame src="bottom.html" name="bottomFrame" title="Main Content">
</frameset>
</html>
