<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Form Example</title>
</head>
<body>
  <h2>Secure Login Form</h2>
  <form action="#" method="post" autocomplete="off">
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" required><br><br>
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>
    <input type="submit" value="Login">
  </form>
  <p>
    <strong>Note:</strong> Turning off autocomplete prevents the browser from storing
    sensitive data like passwords. This reduces the risk of unauthorized access
    if someone else uses your device.
  </p>

</body>
</html>
