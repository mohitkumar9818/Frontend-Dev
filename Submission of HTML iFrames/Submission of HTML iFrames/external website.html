<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embed External Website</title>
</head>
<body>
  <h2>Embedded Wikipedia</h2>
  <iframe 
    src="https://www.wikipedia.org" 
    title="Wikipedia"
    width="80%" 
    height="500"
    style="border:1px solid #ccc;"
    loading="lazy">
  </iframe>
  <p>Some websites may not allow embedding for security reasons.</p>
</body>
</html>
