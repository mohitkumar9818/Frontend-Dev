<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      display: grid;
      grid-template-rows: 70px 1fr;
      grid-template-columns: 250px 1fr;
      grid-template-areas:
        "header header"
        "sidebar main";
      background-color: #f4f6f8;
    }

    /* Header */
    header {
      grid-area: header;
      background-color: #1e293b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }

    /* Sidebar */
    aside {
      grid-area: sidebar;
      background-color: #334155;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 20px;
    }

    aside a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      transition: background-color 0.3s;
    }

    aside a:hover {
      background-color: #475569;
    }

    /* Main Content Area */
    main {
      grid-area: main;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 200px;
      grid-gap: 20px;
      padding: 20px;
    }

    .box {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .box:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    /* Box that spans two columns */
    .wide {
      grid-column: span 2;
    }

    /* Responsive Design */
    @media (max-width: 900px) {
      body {
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "sidebar"
          "main";
      }

      aside {
        flex-direction: row;
        overflow-x: auto;
      }

      main {
        grid-template-columns: 1fr;
      }

      .wide {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <header>My Dashboard</header>

  <aside>
    <a href="#">Overview</a>
    <a href="#">Analytics</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
  </aside>

  <main>
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box wide">Wide Box (Spans 2 Columns)</div>
    <div class="box">Box 4</div>
  </main>

</body>
</html>
