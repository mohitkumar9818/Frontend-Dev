<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Loading Animation</title>
  <style>
    /* Center the loader using Flexbox */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f6fa;
      margin: 0;
    }

    /* Loader container */
    .loader {
      display: flex;
      gap: 15px;
    }

    /* Circles */
    .circle {
      width: 20px;
      height: 20px;
      background-color: #00bcd4;
      border-radius: 50%;
      animation: bounce 0.8s ease-in-out infinite;
    }

    /* Animation delays for sequential bounce */
    .circle:nth-child(1) {
      animation-delay: 0s;
    }
    .circle:nth-child(2) {
      animation-delay: 0.15s;
    }
    .circle:nth-child(3) {
      animation-delay: 0.3s;
    }

    /* Keyframes for bounce motion */
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }
  </style>
</head>
<body>

  <div class="loader">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

</body>
</html>
