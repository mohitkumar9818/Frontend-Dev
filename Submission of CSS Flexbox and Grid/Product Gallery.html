<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f4;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    /* Grid Container */
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    /* Product Cards */
    .card {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      padding: 20px;
      height: 200px; /* Equal height for all cards */
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      margin: 10px 0 5px;
      font-size: 20px;
      color: #333;
    }

    .card p {
      margin: 0;
      font-size: 16px;
      color: #666;
    }

    /* Responsive Design */
    @media (max-width: 1000px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <h1>Our Products</h1>

  <div class="gallery">
    <div class="card">
      <h2>Product 1</h2>
      <p>$25.00</p>
    </div>
    <div class="card">
      <h2>Product 2</h2>
      <p>$30.00</p>
    </div>
    <div class="card">
      <h2>Product 3</h2>
      <p>$20.00</p>
    </div>
    <div class="card">
      <h2>Product 4</h2>
      <p>$35.00</p>
    </div>
    <div class="card">
      <h2>Product 5</h2>
      <p>$40.00</p>
    </div>
    <div class="card">
      <h2>Product 6</h2>
      <p>$28.00</p>
    </div>
    <div class="card">
      <h2>Product 7</h2>
      <p>$22.00</p>
    </div>
    <div class="card">
      <h2>Product 8</h2>
      <p>$50.00</p>
    </div>
  </div>

</body>
</html>
